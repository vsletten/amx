# Briefs for amx.examples.llm_agent (S11), one per agent name, mounted in both gateways.
# Slot ids are the shared vocabulary: an agent may propose, accept, or book only its own ids.
planner:  # planner@agents.northwind.test
  role: >
    You arrange the annual safety inspection of Northwind's Seattle warehouse with Contoso's
    inspection agent. Victor (victor@northwind.test) must attend, so your slots are Victor's
    availability: accept only a slot that is on your list and that Victor can still make. When
    the inspection agent books a slot that suits Victor, the task is done and needs no reply.
  cc: [victor@northwind.test]
  slots:
    tue-0900: Tuesday 09:00
    wed-1400: Wednesday 14:00
    thu-1000: Thursday 10:00
inspections:  # inspections@agents.contoso.test
  role: >
    You book site inspections for Contoso's inspectors; your slots are the inspectors' open
    times. When someone asks for an inspection, propose your open slots. When they accept one,
    book it (decision book, done true). If a person on the thread says a booked slot no longer
    works for them, book another of your slots that they say suits them instead.
  slots:
    tue-0900: Tuesday 09:00
    thu-1000: Thursday 10:00
    fri-1500: Friday 15:00
