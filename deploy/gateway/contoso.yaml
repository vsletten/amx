domain: contoso.test
agent_domain: agents.contoso.test
data_dir: /data
listeners: {milter_host: 0.0.0.0, milter_port: 8890, lmtp_host: 0.0.0.0, lmtp_port: 2424, submission_host: 0.0.0.0, submission_port: 2587}
dns_server: 172.30.0.53
postfix_host: mailhost-ct
postfix_port: 10025
sibling_port: 10027
keys_dir: /keys
# PLAN §5.2: what `amx agent add --live` and `amx trust add` write; the gateway reloads it without
# a restart. From the host, pass --registry-dir deploy/generated/state/ct/registry and
# --keys-dir deploy/generated/keys. The accounts file is the mailhost's (relative to this file,
# so it resolves on the host, where the commands run).
registry_dir: /data/registry
accounts_file: ../generated/state/accounts/ct/agents.passwd
submission_tls_cert: /tls/server.pem
submission_tls_key: /tls/server-key.pem
submission_tls_ca: /tls/dev-ca.pem
mailbox: {host: mailhost-ct, port: 143, master_user: gateway, master_password: dev-gateway}
# PLAN §5.10: an agent declares its own state (pause, resume, capacity) by mailing this
# address through submission. The milter refuses it from outside, and every declaration
# lapses within max_ttl_seconds.
control: {address: control, max_ttl_seconds: 3600}
agents:
  intake:
    handler: amx.examples.intake:handle
    mode: queued       # M4: LMTP 250 means "in intake's bounded work queue"; S04 fills it
    watermark: 2
    workers: 1
    enabled: true
    submit_token: dev-intake-token
  # S17: receive-only siblings of intake with the content judge overridden per agent.
  intake-observe:
    handler: amx.examples.intake:handle
    mode: sync
    content_judge: {mode: observe}
  intake-off:
    handler: amx.examples.intake:handle
    mode: sync
    content_judge: {mode: "off"}
  inspections:         # S11: an LLM agent (amx.examples.llm_agent; brief in llm-briefs.yaml)
    handler: amx.examples.llm_agent:handle
    mode: queued
    watermark: 4
    workers: 1
    submit_token: dev-inspections-token
  # PLAN §5.9: a remote agent. LMTP files its mail in its INBOX and runs nothing here; its
  # handler runs in runner-ct, an IMAP + submission client with only this agent's credentials.
  # The watermark counts INBOX messages the runner has not marked $AmxHandled.
  outpost:
    mode: remote
    watermark: 2
    submit_token: dev-outpost-token
trust:
  - d: agents.contoso.test
    s: intake
    intents: [request, response, update, ack, error]
    schemas: ["*"]
    can_open_tasks: true
  - d: agents.contoso.test
    s: inspections
    intents: [request, response, update, ack, error]
    schemas: ["*"]
    can_open_tasks: true
  - d: agents.contoso.test
    s: outpost
    intents: [request, response, update, ack, error]
    schemas: ["*"]
    can_open_tasks: true
  - d: agents.northwind.test
    s: scheduler
    intents: [request, response, update, ack, error]
    schemas: ["*"]
    can_open_tasks: true
  - d: agents.northwind.test
    s: restricted
    intents: [response]
    schemas: ["*"]
    can_open_tasks: false
  - d: agents.northwind.test
    s: planner
    intents: [request, response, update, ack, error]
    schemas: ["*"]
    can_open_tasks: true
  - d: "*"
    s: "*"
    lane: human
    intents: [request, response]
    schemas: ["*"]
    can_open_tasks: false
    trust: low
limits:
  external_per_day: 10000   # the shipped default is 10; one scenario run sends far more
  references_depth: 12  # S07's responders loop until this; S11's negotiation runs ~8 deep
  received_depth: 25
  max_bytes: 10485760
  blocked_attachment_types:
    - application/x-msdownload
    - application/vnd.microsoft.portable-executable
    - application/x-executable
    - application/x-mach-binary
    - text/x-script
greylisting: false
# PLAN §5.7 content judgments. The shipped default is mode: off; the dev stack enforces so the
# scenarios exercise it. The stub judge is deterministic; S16 stops it by creating the down file.
content_judge:
  backend: stub
  mode: enforce
  stub_down_file: judge-down
  on_judge_error: {agent: tempfail, human: taint}
