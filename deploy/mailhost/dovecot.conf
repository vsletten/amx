listen = *
protocols = imap lmtp
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
disable_plaintext_auth = no
ssl = no
auth_mechanisms = plain login
auth_master_user_separator = *
mail_plugins = $mail_plugins acl

# Master users (gateway, approver) are checked against their own ACL identity, not the owner's.
plugin {
  acl = vfile:/etc/dovecot/dovecot-acl
  acl_globals_only = yes
}

# Master logins are looked up per listening port, and only master-users.143 exists: the IMAP port
# an agent's own host reaches (1143, through edge-ct, PLAN §5.9) accepts no master login.
# real_lport, not lport: a trusted client could claim another port with IMAP ID.
passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users.%{real_lport}
  master = yes
  pass = yes
}
passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

namespace inbox {
  inbox = yes
  # auto = subscribe, not create: mail clients such as Roundcube list only subscribed folders,
  # and Outbox/* is the hold queue's approval UI (S06 checks the subscription list).
  separator = /
  mailbox Drafts {
    auto = subscribe
  }
  mailbox Sent {
    auto = subscribe
  }
  mailbox Trash {
    auto = subscribe
  }
  mailbox Outbox/Held {
    auto = subscribe
  }
  mailbox Outbox/Approved {
    auto = subscribe
  }
  mailbox Outbox/Rejected {
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imap-agent {
    port = 1143
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

protocol lmtp {
  postmaster_address = postmaster@%d
}

log_path = /dev/stderr
info_log_path = /dev/stdout
