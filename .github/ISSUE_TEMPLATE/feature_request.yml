name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and the roadmap before proposing a change.
        For vulnerabilities, read SECURITY.md at this repository's root and use
        Security → Report a vulnerability. Keep secrets and private mail out of this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user-visible need, without private data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and any security or compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workarounds and why they do not meet the need.
    validations:
      required: false
